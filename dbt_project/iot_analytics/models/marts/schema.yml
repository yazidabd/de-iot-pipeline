version: 2

models:
  - name: dim_location
    description: "Tabel dimensi lokasi sensor cuaca"
    columns:
      - name: location_name
        description: "Nama lokasi"
        tests:
          - unique
          - not_null

  - name: dim_time
    description: "Tabel dimensi waktu pembacaan"
    columns:
      - name: ingested_at
        description: "Timestamp pembacaan"
        tests:
          - unique
          - not_null

  - name: fact_weather_reading
    description: "Fact table pembacaan sensor cuaca"
    columns:
      - name: location_name
        description: "Nama lokasi, harus salah satu dari dua kota"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Depok', 'Jakarta']
      - name: temperature_c
        description: "Suhu dalam Celsius, harus masuk akal"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 50
      - name: humidity_pct
        description: "Kelembapan persen, harus 0-100"
        tests:
          - not_null
